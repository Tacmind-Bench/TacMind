dataset:
  format: lerobot
  name: ${hydra:runtime.cwd}/data/LIBERO_LeRobot_v3
  suites:
    - libero_10
    - libero_90
    - libero_goal
    - libero_object
    - libero_spatial
  num_steps: ${eval:'${wm.num_preds} + ${wm.history_size}'}
  frameskip: 5

  primary_camera_key: observation.images.image

  keys_to_load:
    - pixels
    - action
    - proprio

  keys_to_cache:
    - action
    - proprio
