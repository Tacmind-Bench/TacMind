[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "TacMind-0"
version = "0.1.0"
description = "TacMind-0 vision-tactile-language-action policy with a Tac-LeWM encoder."
authors = [
    { name = "DM Team" }
]
readme = {text = "TacMind-0 setup, training and evaluation: https://github.com/Tacmind-Bench/TacMind#train", content-type = "text/markdown"}
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "torch==2.10.0",
    "torchvision==0.25.0",
    "transformers==5.12.1",
    "accelerate==1.13.0",
    "einops==0.8.2",
    "tokenizers==0.22.2",
    "sentencepiece==0.2.2",
    "timm==1.0.16",
    "numpy==2.3.5",
    "av==16.1.0",
    "albumentations==2.0.8",
    "opencv-python==4.11.0.86",
    "pyarrow==24.0.0",
    "orjson==3.11.9",
    "megfile==5.0.16",
    "easydict==1.13",
    "flask==3.1.3",
    "requests==2.34.2",
    "pydantic==2.13.4",
    "loguru==0.7.3",
    "tyro==1.0.13",
    "tqdm==4.67.3",
    "datasets==5.0.0",
    "diffusers==0.37.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "ruff"]

attention = [
    "flash_attn",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tacmind0*"]
exclude = ["tacmind0.tactile.lewm.pretraining.upstream*"]

[tool.setuptools.package-data]
"tacmind0.tactile.lewm" = ["LICENSE"]

[tool.ruff]
line-length = 88
target-version = "py312"
force-exclude = true
extend-exclude = [
    "checkpoints/**",
    "user_checkpoints/**",
    "wandb/**",
    "assets/**",
    "data/**",
    "norm/**",
    "tacmind0/tactile/lewm/pretraining/upstream/**",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
]
ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
